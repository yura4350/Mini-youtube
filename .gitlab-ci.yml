deploy_to_duke_vm:
  stage: deploy
  image: alpine:latest
  before_script:
    # Install ssh-agent if not already installed
    - 'command -v ssh-agent >/dev/null || ( apk add --update openssh )' 
    # Run ssh-agent. We need to do this to add the SSH key to the agent store.
    - eval $(ssh-agent -s)
    # Add the SSH key stored in SSH_PRIVATE_KEY variable to the agent store. This is the private key for the SSH key pair we use to connect to the Duke VM.
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    # Create the SSH directory and give it the right permissions
    - mkdir -p ~/.ssh
    # Give the SSH directory the right permissions
    - chmod 700 ~/.ssh
    # Add the server's host key to known_hosts to prevent interactive prompts
    - ssh-keyscan $SERVER_IP >> ~/.ssh/known_hosts
    # Give the known_hosts file the right permissions
    - chmod 644 ~/.ssh/known_hosts
  script:
    # Connect via SSH to navigate to the directory, pull latest changes, and rebuild Docker containers
    - ssh $SERVER_USER@$SERVER_IP "cd media_server_team02 && git checkout main && git pull origin main && docker compose down && docker compose up -d --build"
  only:
    # Only run this job on the dev branch
    - main