stages:
  - test

python_tests:
  stage: test
  image: python:3.13-slim
  script:
    - pip install -r requirements.txt
    - pip install pytest
    - |
      if find . -type f \( -name 'test*.py' -o -name '*_test.py' \) | grep -q .; then
        pytest -q
      else
        echo "No Python tests found."
      fi

frontend_checks:
  stage: test
  image: node:20-alpine
  script:
    - |
      if [ -f frontend/package.json ]; then
        cd frontend
        npm ci
        npm test --if-present
        npm run build --if-present
      else
        echo "No frontend/package.json found."
      fi

vm_health_checks:
  stage: test
  image: curlimages/curl:8.12.1
  when: manual
  allow_failure: true
  script:
    - curl -fsS http://vcm-52418.vm.duke.edu:5173 >/dev/null
    - curl -fsS http://vcm-52418.vm.duke.edu:8000/health
    - curl -fsS http://vcm-52418.vm.duke.edu:8001/health
    - curl -fsS http://vcm-52418.vm.duke.edu:8002/health
    - curl -fsS http://vcm-52418.vm.duke.edu:8003/health
    - curl -fsS http://vcm-52418.vm.duke.edu:8004/health
    - curl -fsS http://vcm-52418.vm.duke.edu:8004/dashboard/recommend
